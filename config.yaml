# ═══════════════════════════════════════════════════════════════════════════════
# Elements Characterization Pipeline — Configuration
#
# Edit this file, then run:
#     python run_pipeline.py
#     python run_pipeline.py --config path/to/other_config.yaml
#
# All outputs are written to:
#     data/outputs/<run_name>_<YYYYMMDD_HHMMSS>/
# ═══════════════════════════════════════════════════════════════════════════════

# ── Run metadata ────────────────────────────────────────────────────────────────
run_name: "baseline"   # Used as the output folder name prefix


# ── Clustering hyperparameters ──────────────────────────────────────────────────
seed: 42
ks: [2, 3, 4]          # Number of clusters to evaluate
algorithms:
  - "KMeans"
  - "KMeans++"
  - "Hierarchical"
  - "GMM"


# ── Monte Carlo augmentation ────────────────────────────────────────────────────
# Controls Datasets B and C (mc_augment=True).
# Dataset A always uses the 9 original point estimates.
n_mc: 100              # MC draws per sample  →  9 × n_mc rows in B and C


# ── Feature selection ────────────────────────────────────────────────────────────
# tiers:
#   null                      → all elements kept (default behaviour)
#   ["tier1"]                 → P, Fe, Si, As, Sb  (severe conductivity impact)
#   ["tier1", "tier2"]        → + Sn, Mn, Ni, Cr, Al  (moderate impact)
#   ["tier1", "tier2", "tier3"] → + Ag, Zn, Pb, Mg, B, Te  (lower impact)
#
# drop_discarded:
#   false → keep all columns (default)
#   true  → remove Cu, Mn, Cr, Cd, Be, S, Al, Au, Zr, Pt, Co, Ti, Bi
#           (near-zero variance across the 9 reference samples)
tiers: null
drop_discarded: false


# ── New sample classification ────────────────────────────────────────────────────
classification:

  # Which fitted dataset and K to use as the classification reference
  reference_dataset: "C"   # A, B, or C
  reference_k: 4            # must be in `ks` above

  # ── Auto-generated blend samples ──────────────────────────────────────────────
  # Creates n convex combinations:  new = α·sample_i + (1−α)·sample_j
  # α is drawn uniformly from [0.2, 0.8].  Set enabled: false to skip.
  blends:
    enabled: true
    n: 8
    seed: 99

  # ── Manually defined new samples ──────────────────────────────────────────────
  # List the elements you want to specify.
  # Any element NOT listed defaults to 0.0.
  # Element names must match those in compositions.py (case-sensitive).
  #
  # Example — a sample similar to 1B sac4 but with higher Pb:
  manual_samples:
    - name: "test_high_sn_pb"
      elements:
        Zn:  0.0101
        Pb:  0.0200   # higher Pb than 1B sac4 (0.0053)
        Sn:  0.0199
        P:   0.00026
        Fe:  0.0015
        Si:  0.0017
        Mg:  0.00031
        As:  0.00057
        Sb:  0.0022
        Ag:  0.00096
        B:   0.00048
        Te:  0.0029

    - name: "test_2N_like"
      elements:
        Pb:  0.3020    # similar to 2N sac2 — very high Pb
        Sn:  0.0055
        Fe:  0.0012
        Ni:  0.00020
        Si:  0.00085
        Mg:  0.00017
        As:  0.00054
        Sb:  0.0042
        Ag:  0.00082
        B:   0.00045
        Te:  0.0020
